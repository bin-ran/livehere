name: Release

# 推 v* tag 时自动发布到 npm（Trusted Publishing：OIDC，不需要 NPM_TOKEN）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # OIDC：npm provenance + trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # trusted publishing 需要较新的 npm（发布仍用 npm CLI）
      - name: Update npm
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm check && pnpm exec oxfmt --check src test scripts

      - name: Build
        run: pnpm build

      - name: Publish
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
