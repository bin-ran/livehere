name: Release

# 两种触发方式：
# 1) 推 v* tag  → 正式发布（Trusted Publishing：OIDC，无需 NPM_TOKEN）
# 2) 手动触发   → 先 dry-run 或 stage 验证链路，确认无误后再发版
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run 只构建打包不上传；stage 走 staged publish（会真正走 OIDC）；publish 正式发布'
        type: choice
        options: [ dry-run, stage, publish ]
        default: dry-run

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # OIDC：npm provenance + trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 版本由 package.json 的 packageManager 决定：
      # 同时写 with.version 会让 action-setup 报 Multiple versions of pnpm specified
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # trusted publishing 需要较新的 npm（发布仍用 npm CLI）
      - name: Update npm
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify:meta && pnpm check && pnpm exec oxfmt --check src test scripts

      - name: Build
        run: pnpm build

      # 推旧 tag 时（`git push --follow-tags` 会带上历史 tag）容易重复触发，
      # 版本已存在于 npm 就直接跳过，让工作流幂等
      - name: Check version on npm
        id: published
        run: |
          spec="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$spec 已存在于 npm，本模式（正式发布）将跳过"
          fi

      - name: Publish
        if: steps.published.outputs.exists != 'true' || inputs.mode == 'dry-run' || inputs.mode == 'stage'
        env:
          # tag 推送时 inputs.mode 为空 → 走正式发布
          MODE: ${{ inputs.mode || 'publish' }}
        run: |
          case "$MODE" in
            dry-run) npm publish --dry-run --access public ;;
            stage)   npm stage publish ;;
            *)       npm publish --provenance --access public ;;
          esac

      - name: Create GitHub Release
        if: github.event_name == 'push' && steps.published.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
