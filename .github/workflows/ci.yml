name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 22.x, 24.x, 26.x ]

    steps:
      - uses: actions/checkout@v7

      # 版本由 package.json 的 packageManager 决定：
      # 同时写 with.version 会让 action-setup 报 Multiple versions of pnpm specified
      - uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm exec oxfmt --check src test scripts

      - name: Test
        run: pnpm test

      - name: Build (含 publint / attw 校验)
        run: pnpm build

      - name: Smoke test (真实产物)
        run: pnpm smoke
